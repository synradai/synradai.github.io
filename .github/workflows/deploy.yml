name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # Beta is a second Vite build. It lands in dist/beta after the live
      # build, so the live files stay as they are and /beta/ is published
      # with them. These VITE_ values are public client config.
      - name: Build the beta
        env:
          VITE_SUPABASE_URL: https://rocobdfuvaecrkzsxqub.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9yW8f5NAHjuIUXWvj4Xnpw_2EXzLkLE
          VITE_AI_PROXY_URL: https://rocobdfuvaecrkzsxqub.supabase.co/functions/v1/generate-grok
        run: |
          npm run build:beta
          mkdir -p dist/beta
          cp -a dist-beta/. dist/beta/
      # Safe Intelligence on the LIVE project, served at /app/. Same beta app,
      # built in mode "app" (the only mode allowed to use the live project).
      # / and /beta/ are unchanged. These VITE_ values are public client config.
      - name: Build the live app at /app/
        env:
          VITE_SUPABASE_URL: https://rgkiagqexoafmtxhrlqo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3AVXvoIyu8rmZslxKNUAtA_hlgIANdL
          VITE_AI_PROXY_URL: https://rgkiagqexoafmtxhrlqo.supabase.co/functions/v1/generate-grok
        run: |
          npm run build:app
          mkdir -p dist/app
          cp -a dist-app/. dist/app/
          sed -i -e 's#"/beta/"#"/app/"#g' -e 's#"Safe Intelligence beta"#"Safe Intelligence"#' -e 's#"SI beta"#"Safe Intel"#' dist/app/manifest.webmanifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
