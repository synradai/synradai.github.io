# generate-grok only. The beta project signs user JWTs with ES256, and the
# edge gateway's verify_jwt check rejects those tokens before the function
# runs. The function still checks the caller with auth.getUser().

[functions.generate-grok]
verify_jwt = false

# action-reminder checks the caller with auth.getUser(). The action read is
# limited to that caller's organisation by row level security.
# The gateway verify_jwt check rejects the beta project's ES256 tokens.
[functions.action-reminder]
verify_jwt = false

# airtable-import checks the caller with auth.getUser().
# The token in the body is used once and is not stored.
[functions.airtable-import]
verify_jwt = false

# submit-form is public. Workers have no session. The function checks the
# QR token itself and does not call requireAal2.
[functions.submit-form]
verify_jwt = false
